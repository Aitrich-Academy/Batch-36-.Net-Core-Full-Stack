<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout-Admin_JobPortal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body {
      font-family: Arial, sans-serif;
      background-color: #ffffff;
    }

    /* Left section */
    .left-panel {
      background-color: #f2f2f2;
      min-height: 100vh;
    }

    .left-panel img {
      display: block;
      margin: auto;
    }

    /* Right section */
    .login-box {
      width: 100%;
      max-width: 350px;
      /* margin-top: -50px; */
    }

    .form-control {
      background-color: #f2f2f2;
      height: 60px;
    }

    .btn-login {
      background-color: #3b2eff;
      color: #fff;
    }

    .btn-login:hover {
      background-color: #2a20cc;
      color: #fff;
    }
  </style>
</head>

<body>

  <!-- Main Heading -->
  <h3 class="text-center fw-bold mt-4 mb-3">Platform Admin Module</h3>

  <div class="container-fluid">
    <div class="row min-vh-100">
        <h5 class="fw-bold align-self-start mb-4">Logout</h5>
      <!-- LEFT SIDE -->
      <div class="col-md-6 d-md-flex flex-column justify-content-start align-items-center left-panel p-4">

        <!-- Center content -->
        <div class="text-center mt-5">

          <div class="d-flex align-items-center justify-content-center mb-5">
            <img src="images/Group 8.png" alt="J Logo" height="50" class="me-3">
            <img src="images/Hire me Now.png" alt="Jobie" height="30" class="ms-0" >
        </div>
          <!-- Illustration -->
          <img src="images/Group.png" alt="Illustration" height="100" class="img-fluid">

        </div>
      </div>

      <!-- RIGHT SIDE -->
      <div class="col-md-6 d-flex justify-content-center align-items-center ">

        <div class="login-box mt-4">

          <h6 class="mb-4">Sign in to AdminDashboard</h6>

          <form action="dashboard.html" method="get">
            <div class="mb-4">
              <input type="email" class="form-control" placeholder="Email">
            </div>

            <div class="mb-4">
              <input type="password" class="form-control" placeholder="Password">
            </div>
            <div class="text-end mb-3">
                <a href="#" class="text-decoration-none small">Forgot password?</a>
            </div>
            <button type="submit" class="btn btn-login w-100">
              Sign In
            </button>
          </form>

        </div>
      </div>

    </div>
  </div>

</body>
</html>
