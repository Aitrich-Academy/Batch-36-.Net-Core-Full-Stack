<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Platform Admin-JobPortal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
    }

    
  </style>
</head>

<body>
<div class="d-flex align-items-center p-3 border-bottom d-md-none">
  <i class="bi bi-list fs-2 me-3" id="menuToggle" style="cursor:pointer;"></i>
  <div class="p-3 fw-bold fs-5">
        <img src="images/Group 8.png" width="40px"> 
        <font size="6"><i><b>Jobie</b></i></font>
      </div>
</div>
<div id="overlay"></div>
<div class="container-fluid">
  <div class="row gx-5">
    <h1>Dashboard</h1>
    <!-- SIDEBAR -->
    <div class="col-md-2 col-lg-2 sidebar p-0" id="sidebar">
      <div class="p-3 fw-bold fs-5">
        <img src="images/Group 8.png" width="40px"> 
        <font size="6"><i><b>Jobie</b></i></font>
      </div>

      
      <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="jobprovider.html"><i class="bi bi-building"></i> Job Providers</a>
      <a href="jobseeker.html"><i class="bi bi-people"></i> Job Seekers</a>
      <a href="joblist.html"><i class="bi bi-briefcase"></i> Jobs</a>
      <!-- <i class="bi bi-person"></i> My Profile -->
      <a href="message.html"><i class="bi bi-chat"></i> Messages</a>
      <a href="addskill.html"><i class="bi bi-award"></i> Skills</a>
      <a href="logout.html"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>

    <!-- MAIN CONTENT -->
    <div class="col-md-10 col-lg-10 p-5 ps-5 main-content">

      <h4 class="fw-bold mb-4">Platform Admin</h4>

      <!-- STATS ROW -->
      <div class="row g-3">

        <div class="col-md-4 d-flex justify-content-center">
          <div class="stat-card">
            <div>
              <small>Total Jobs Posted</small>
              <h3>103</h3>
            </div>
            <i class="bi bi-briefcase stat-icon"></i>
          </div>
        </div>

        <div class="col-md-4 d-flex justify-content-center">
          <div class="stat-card">
            <div>
              <small>Total JobSeekers</small>
              <h3>53</h3>
            </div>
            <i class="bi bi-person stat-icon"></i>
          </div>
        </div>

        <div class="col-md-4 d-flex justify-content-center">
          <div class="stat-card">
            <div>
              <small>Total Companies</small>
              <h3>65</h3>
            </div>
            <i class="bi bi-building stat-icon"></i>
          </div>
        </div>

        <div class="col-md-4 d-flex justify-content-center">
          <div class="stat-card">
            <div>
              <small>Total JobProviders</small>
              <h3>36</h3>
            </div>
            <i class="bi bi-building-check stat-icon"></i>
          </div>
        </div>

      </div>

      <!-- CHART PLACEHOLDER -->
      <div class="chart-box">
        <h6 class="mb-3">Total Count</h6>
        <canvas id="dashboardChart" width="300px"></canvas>
      </div>
      
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>

    // Chart graph
  const ctx = document.getElementById('dashboardChart').getContext('2d');

  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ['Jobs Posted', 'Job Seekers', 'Companies', 'Job Providers'],
      datasets: [{
        label: 'Total Count',
        data: [103, 20, 65, 36],
        backgroundColor: [
          'rgba(255, 99, 132, 0.4)',
          'rgba(54, 162, 235, 0.4)',
          'rgba(255, 206, 86, 0.4)',
          'rgba(153, 102, 255, 0.4)'
        ],
        borderColor: [
          'rgba(255, 99, 132, 1)',
          'rgba(54, 162, 235, 1)',
          'rgba(255, 206, 86, 1)',
          'rgba(153, 102, 255, 1)'
        ],
        barPercentage: 0.3,
        borderWidth: 1
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });

  //to view the sidebar in smaller devices
 const menuToggle = document.getElementById("menuToggle");
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("overlay");

  menuToggle.addEventListener("click", function () {
    sidebar.classList.toggle("show");
    overlay.classList.toggle("show");
  });

  // Close sidebar when clicking outside
  overlay.addEventListener("click", function () {
    sidebar.classList.remove("show");
    overlay.classList.remove("show");
  });
</script>
</body>
</html>
