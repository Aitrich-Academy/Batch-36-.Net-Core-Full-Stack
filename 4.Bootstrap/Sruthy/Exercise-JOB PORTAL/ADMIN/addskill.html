<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Platform Admin-JobPortal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
    
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      /* background-color: #f8f9fa; */
    }

  </style>
  
</head>

<body>
<div class="d-flex align-items-center p-3 border-bottom d-md-none">
  <i class="bi bi-list fs-2 me-3" id="menuToggle" style="cursor:pointer;"></i>
  <div class="p-3 fw-bold fs-5">
        <img src="images/Group 8.png" width="40px"> 
        <font size="6"><i><b>Jobie</b></i></font>
      </div>
</div>
<div id="overlay"></div>
<div class="container-fluid">
  <div class="row gx-5">
    <h1>Messages</h1>
    <!-- SIDEBAR -->
    <div class="col-sm-2 col-md-2 col-lg-2 sidebar p-0" id="sidebar">
      <div class="p-3 fw-bold fs-5">
        <img src="images/Group 8.png" width="40px"> 
        <font size="6"><i><b>Jobie</b></i></font>
      </div>

      <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="jobprovider.html"><i class="bi bi-building"></i> Job Providers</a>
      <a href="jobseeker.html"><i class="bi bi-people"></i> Job Seekers</a>
      <a href="joblist.html"><i class="bi bi-briefcase"></i> Jobs</a>
      <!-- <i class="bi bi-person"></i> My Profile -->
      <a href="message.html"><i class="bi bi-chat"></i> Messages</a>
      <a href="addskill.html"><i class="bi bi-award"></i> Skills</a>
      <a href="logout.html"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>

    <!-- MAIN CONTENT -->
    <div class="col-sm-10 col-md-10 col-lg-10 main-content pref">
      <div class="col-sm-10 col-md-10 col-lg-10 ps-5 pt-5 mt-5">
        <div class="mt-4" >
          
            <input type="text" class="form-control skill  mb-3" placeholder="Skill Name">
            <textarea class="form-control skill-desc mb-4" placeholder="Skill Description"></textarea>

            <div class="d-flex gap-3">
              <a href="skill-list.html" class="btn btn-primary">
                Add Skills
              </a>
              <a href="skill-list.html" class="btn btn-primary">
                Skill List
              </a>
            </div>
         

        </div>
      </div>
    </div>
  </div>
</div>



<script>

//to view the sidebar in smaller devices
 const menuToggle = document.getElementById("menuToggle");
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("overlay");

  menuToggle.addEventListener("click", function () {
    sidebar.classList.toggle("show");
    overlay.classList.toggle("show");
  });

  // Close sidebar when clicking outside
  overlay.addEventListener("click", function () {
    sidebar.classList.remove("show");
    overlay.classList.remove("show");
  });
</script>
</body>
</html>
