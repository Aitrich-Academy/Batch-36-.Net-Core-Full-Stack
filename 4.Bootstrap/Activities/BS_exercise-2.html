<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
         .leftside {
            width: 30%;
            background-color: #007bff; /* A blue color */
            color: white;
            height: 100vh;
            position: fixed; /* Fixes the sidebar position */
            padding-top: 50px;
            text-align: center;
        }
         .leftside a {
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            display: block;
          
        }
       
        .leftside a:hover {
            background-color: #0056b3;
            color: white;
        }
        .nav{
             /* position: absolute; */
           
            padding-left: 70px;
            padding-top: 30px;
            text-align: left;
        }
        ul image{
            width:20px;
             height:20px 
        }
         .content {
            margin-left: 370px; /* Offset the content by the width of the sidebar */
            padding: 20px;
           
           
        }
    </style>
</head>
<body>
   <div class="container-fluid">
    <div class="row">
         <div class="leftside ">
        <h2 class="">Hire Me Now!!...</h2>
        <ul class="nav flex-column mb-auto">
        <li class="nav-item">
            <a href="#" class="nav-link ">
                <img src="images/dashboard 1.png" alt="Dashboard"  class="me-2"> 
                Dashboard
            </a>
        </li>
        <li class="nav-item">
            <a href="#" class="nav-link ">
                <img src="images/suitcase 2.png" alt="Jobs"  class="me-2"> 
                Jobs
            </a>
        </li>
        <li class="nav-item">
            <a href="#" class="nav-link ">
                <img src="images/application (1) 1.png" alt="Applications"  class="me-2"> 
                Applications
            </a>
        </li>

        <li class="nav-item">
            <a href="#"  class="nav-link ">
                <img src="images/question (1) 1.png" alt="Interviews" class="me-2">
                Interviews
            </a>
        </li>

        <li class="nav-item">
            <a href="#" class="nav-link">
                <img src="images/message 1.png" alt="message" class="me-2">
                Messages
            </a>
        </li>

        <li class="nav-item">
            <a href="#" class="nav-link">
                <img src="images/settings 1.png" alt="settings" class="me-2">
                Settings
            </a>
        </li>
        
    </ul>

    <ul class="nav flex-column p-6 mt-auto">
        <li class="nav-item">
            <a href="#" class="nav-link">
                <img src="images/add-group (1) 1.png" alt="Add"class="me-2"> 
                Add New
            </a>
        </li>
    </ul>
    </ul>

    </div>

     <div class="content">
       <div class="container-fluid">
         <nav class="navbar  border-bottom border-1 border-black ">
                <div class="col text-end">
                    <i class="fas fa-bell me-3"></i>
                    <img src="images/notification-bing.png" alt="bell" class="rounded-circle" width="30px" height="30px">
                    <img src="images/cheerful.png" alt="Olivia" class="rounded-circle" width="40px" height="40px">
                    <span class="ms-2">Olivia</span>
                </div>
         </nav>

          <div class="container-fluid">
            <h2 class="mb-4 text-end">Short List</h2>
            <div class="row  border-top border-1 border-black">
                <div style=" width: 100%;" class="col-md-6  ">
                   <div class="inside-container "> 
                    <label for="jobTitle" class="form-label fw-semibold ">Job Title</label>
                    <input type="textbox" id="jobTitle" class="form-control w-75 mb-3  bg-body-tertiary " placeholder=" Select Jobtitle">
                    

                    <label for="date" class="form-label fw-semibold ">Date</label>
                    <input type="textbox" id="date" class="form-control w-50 mb-3 bg-body-tertiary   " placeholder="Select Date">
                    <img src="images/images.png" alt="calender"style="width: 80px; height: 80px;">
                    <br>

                    <label for="time" class="form-label fw-semibold">Time</label>
                    <input type="time" id="time" class="form-control w-50 bg-body-tertiary" placeholder="Enter Time">

                    <label for="location" class="form-label fw-semibold">Location</label>
                    <input type="textbox" id="location" class="form-control w-50 bg-body-tertiary" placeholder="Enter Location">
                </div>
                    

                    <div class=" inside-container images col-md-1">
                    <img src="images/images.png" alt="calender"style="width: 80px; height: 80px;;">
                    <img src="images/download.png" alt="clock"style="width: 80px; height: 80px;">
                    <img src="images/download (1).png" alt="location"style="width:80px; height: 80px;">

                 </div>
                   
                </div>
                <!-- You can add the icons in another column -->
                 
            </div>
            
          
            
        </div>
        <br><br>
    <div class="d-inline-flex gap-4 align-items-center">
    <button class="btn btn-primary">Send</button>

    <!-- Notification Toggles -->
    <div class="form-check form-switch mb-0">
        <label class="form-check-label" for="pushNotification">Push Notification</label>
        <input class="form-check-input" type="checkbox" id="pushNotification" checked>
        
    </div>
    
    <div class="form-check form-switch mb-0">
        <label class="form-check-label" for="emailNotification">Email Notifications</label>
        <input class="form-check-input" type="checkbox" id="emailNotification" >
         </div>
</div>
       </div>
     </div>

    </div>
   </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>  
</body>
</html>
