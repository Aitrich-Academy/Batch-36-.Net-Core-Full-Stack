<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
     <style>
        /* .Outline-Buttons{
            display: grid;
            gap: 20px;
            width: 40px;
        } */
         .box1{
            background-color: red;
            text-align: center;
         }
         .box2{
            background-color: yellow;
         }
         .box3{
            background-color: pink;
         }
     </style>
</head>
<body>
    <!-- #Q1base class .btn. -->
   <h2>#1</h2>
    <button type="button" class="btn ">#1 base class .btn.</button>
<hr>
    <!-- #Q2.btn-primary, .btn-success, and .btn-danger. -->
    <h2>#2</h2>
    <button type="button" class="btn btn-primary">Save</button>
    <button type="button" class="btn btn-success">Submit</button>
    <button type="button" class="btn btn-danger">Delete</button>
<hr>
    <!-- #3a link using .btn-link. -->
     <h2>#3</h2>
     <button type="button" class="btn btn-link">its a link button</button>
     <hr>

     <!-- #4outline buttons -->
      <h2>#4 </h2>
      <h6>Outline-Buttons</h6>
      <div class="Outline-Buttons " >
        <button type="button" class="btn btn-outline-primary">Save</button>
        <button type="button" class="btn btn-outline-success">Submit</button>
        <button type="button" class="btn btn-outline-danger">Delete</button>
      </div>
      <hr>
      <!-- #5 buttons of different sizes: -->
       <h2>#5</h2>
       <button type="button" class="btn btn-primary btn-sm">Button</button>
       <button type="button" class="btn btn-primary btn-lg">Button</button>

       <hr>
       <!-- #6 fullwidth button -->
        <h2>#6</h2>
        <!-- <div class="container btn-block">
            <button type="button" class="btn btn-primary btn-block ">Full width button</button>
        </div> -->
       <div class="container">
           <!-- Use d-grid on the wrapper to make the button full-width -->
           <div class="d-grid gap-2">
                <button class="btn btn-primary" type="button">Full Width Button</button>
           </div>
       </div>

       <hr>
       <!-- #7 group of buttons-->
        <h2>#7</h2>
        <div class="btn-group" role="group" aria-label="Basic example">
              <button type="button" class="btn btn-primary">Left</button>
              <button type="button" class="btn btn-primary">Middle</button>
              <button type="button" class="btn btn-primary">Right</button>
       </div>

       <hr>
       <!-- #8disabled button -->
        <h2>#8</h2>
        <button type="button" class="btn btn-primary" disabled>Disabled Button</button>

        <hr>
        <!-- |#9 Combine buttons with icons -->
         <h2>#9</h2>
         <button type="button" class="btn btn-primary">
          <i class="bi bi-download"></i> Download
         </button>

         <button type="button" class="btn btn-secondary" aria-label="Download">
           <i class="bi bi-download"></i>
         </button>

         
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
