<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{
            margin: 0px;
            padding: 0%;
        }
        .leftside{
            
                width: 25%;
                height: 700px;
                background-color: rgb(73, 73, 230);
                text-align: center;
                color: white;
                padding-top: 50px;
            
            
        }
         ul{
            position: absolute;
            color: white;
            padding-left: 70px;
            padding-top: 30px;
            text-align: left;

        }
        ul img{
            height: 25px;
            width: 25px;
            margin-right: 15px; 
        }
         .addnew{
            margin-top: 480px;
            /* margin-left: 70px; */
        }
        .addnew img{
            width: 80px;
            height: 80px;
        }
        .content {
            margin-left: 300px; 
            margin-top: -700px;/* Offset the content by the width of the sidebar */
            padding: 20px;
        }
        .container-fluid{
        border: 0px solid;
        width: 78%;
        }
        .d-inline-flex{
            margin-left: 430px;

        }
        .images{
            margin-left: 470px;
            margin-top: -220px;
        }
    </style>
</head>
<body>
    <div class="leftside">
        
<h2>Hire Me Now!!...</h2>

<ul type="none">
            <li  class="listdiv"><img src="images/dashboard 1.png" alt="dashboard img"align="center">Dashboard</li>
            <br>
            <br>
            <li  class="listdiv"><img src="images/suitcase 2.png" alt="suitcase img"align="center">Jobs</li>
             <br>
            <br>
            <li  class="listdiv"><img src="images/application (1) 1.png" alt="applctn img"align="center">Applications</li>
             <br>
            <br>
            <li  class="listdiv"><img src="images/question (1) 1.png" alt="intrvw img"align="center">Interviews</li>
             <br>
            <br>
            <li class="listdiv"><img src="images/message 1.png" alt="mssg img"align="center"> Messages</li>
             <br>
            <br>
            <li class="listdiv"><img src="images/settings 1.png" alt="settings img"align="center">Settings</li>
        </ul>
        <div class="addnew">
            <img src="images/add-group (1) 1.png">
            <div class="new"><a><h3>Add New</h3></a></div>
        </div>
    </div>

  

    <div class="content">
         <nav class="navbar  border-bottom border-1 border-black ">
                <div class="col text-end">
                    <i class="fas fa-bell me-3"></i>
                    <img src="images/notification-bing.png" alt="bell" class="rounded-circle" width="30px" height="30px">
                    <img src="images/cheerful.png" alt="Olivia" class="rounded-circle" width="40px" height="40px">
                    <span class="ms-2">Olivia</span>
                </div>
         </nav>
        <!-- Main content goes here, use Bootstrap grid and form components -->
        <div class="container-fluid">
            <h2 class="mb-4 text-end">Short List</h2>
            <div class="row  border-top border-1 border-black">
                <div style=" width: 100%;" class="col-md-6  ">
                    <label for="jobTitle" class="form-label fw-semibold ">Job Title</label>
                    <input type="textbox" id="jobTitle" class="form-control w-75 mb-3  bg-body-tertiary " placeholder=" Select Jobtitle">
                    

                    <label for="date" class="form-label fw-semibold">Date</label>
                    <input type="textbox" id="date" class="form-control w-50 mb-3 bg-body-tertiary" placeholder="Select Date">

                    <label for="time" class="form-label fw-semibold">Time</label>
                    <input type="time" id="time" class="form-control w-50 bg-body-tertiary" placeholder="Enter Time">

                    <label for="location" class="form-label fw-semibold">Location</label>
                    <input type="textbox" id="location" class="form-control w-50 bg-body-tertiary" placeholder="Enter Location">
                    

                    <div class="  images col-md-2">
                    <img src="images/images.png" alt="calender"style="width: 80px; height: auto;">
                    <img src="images/download.png" alt="clock"style="width: 80px; height: auto;">
                    <img src="images/download (1).png" alt="location"style="width:80px; height: auto;">

                 </div>
                    <!-- Add Time and Location inputs similarly with form-control -->
                </div>
                <!-- You can add the icons in another column -->
                 
            </div>
            
          
            
        </div>
        </div>


       
<br><br>
    <div class="d-inline-flex gap-4 align-items-center">
    <button class="btn btn-primary">Send</button>

    <!-- Notification Toggles -->
    <div class="form-check form-switch mb-0">
        <label class="form-check-label" for="pushNotification">Push Notification</label>
        <input class="form-check-input" type="checkbox" id="pushNotification" checked>
        
    </div>
    
    <div class="form-check form-switch mb-0">
        <label class="form-check-label" for="emailNotification">Email Notifications</label>
        <input class="form-check-input" type="checkbox" id="emailNotification" >
         </div>
</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
