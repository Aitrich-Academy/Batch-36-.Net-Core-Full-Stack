<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
         body{
            position: absolute;
            min-height: 100vh;
            width: 100%;
             margin: 0;
        /* padding: 15px; */
        }
        .confirm-card{
             border: 0px solid;
            width: 100%;
            box-shadow: 0 0 0.25em 0.25em rgba(0, 0, 0, 0.25);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            

        }
        .card-icon{
            width: 40%;
        }
        /* .confirm-button{
            width: 20%;
        } */
        .input-icon{
            width: 20px;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center">
        <div class="row w-100 justify-content-center">
            <div class="col-sm-12 col-md-8 col-lg-6 d-flex justify-content-center">

                <div class="confirm-card">
                    <img src="images/confirmpwd.png" alt="confirm icon" class="card-icon  mb-5">
                    <form>
                        <div class="mb-3">
                           <label for="password" class="form-label d-flex align-items-left justify-content-left"><img src="images/lock-black.png" alt="lock icon" class="input-icon">
                            Password:</label>
                           <input type="password" class="form-control" id="password">
                        </div>

                        <div class="mb-3">
                            <label for="confirm-password" class="form-label d-flex align-items-left justify-content-left"><img src="images/double-tick.png" alt="double-tick-icon" class="input-icon">Confirm Password:</label>
                            <input class="form-control" type="password" id="confirm-password">
                        </div>

                       
                        <div class="d-flex justify-content-start">
                          
                           <a href="DashBoard-Job-Provider.html">
                            <button type="button" class="btn btn-primary d-inline-flex align-items-center justify-content-center">
                               Submit
                               <img src="images/send.png" class="ms-2 " style="width:15px; height:15px;" alt="Send Icon">
                           </button>
                           </a>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
