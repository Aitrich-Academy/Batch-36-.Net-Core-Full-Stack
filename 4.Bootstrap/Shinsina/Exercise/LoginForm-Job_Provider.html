<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
     <style>
        body{
        background: linear-gradient( to bottom,  #42538d,   #5a1f73);
        min-height: 100vh;
        width: 100%;
        margin: 0;
        
        }
        .login-card{
            width: 400px;
            height: 400px;
            box-shadow: 0 0 0.25em 0.25em rgba(0, 0, 0, 0.25);
            padding: 30px;
            border-radius: 10px;
            background: linear-gradient(to bottom, #58095D, #552E69, #5E4793);
            text-align: center;
            color: white;
            max-width: 400px; /* Limits width on desktop */
           
           
        }
        .login-title{
            font-size: 30px;
            font-weight:lighter;
            color: #E0B0FF;
        }

         .form-group {
            border: 0px gray;
            margin-top: 10px;
            margin-bottom: 15px;
        }
      
        .login-button{
            margin-top: 30px;
            width: 50%;
            padding: 10px;
            background: #6F42C1; 
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .links{
            margin-top: 30px;
        }
     
     </style>
</head>
<body>
   
<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center">
    <div class="row w-100 justify-content-center">
        
        <div class="col-sm-12 col-md-6 col-lg-4 d-flex justify-content-center">
            <div class="login-card">
                <h2 class="login-title">Login</h2>
                <form>
                    <div class="form-group">
                        <input type="email" id="email" placeholder="Your Email" class="form-control">
                    </div>
                    <div class="form-group">
                        <input type="password" id="pwd" placeholder="Your Password" class="form-control">
                    </div>
                    <div class="checkbox-container">
                        <input type="checkbox" id="chkbox">
                        <label for="chkbox">keep me logged in</label>
                    </div>
                    <button type="submit" class="btn btn-primary login-button">Login</button>
                    <div class="links">
                        <a href="#">Forgot password?</a>
                        <p>Don't have an account? <a href="Signup-Job_Provider.html">Sign Up</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
