<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
     <style>
        body{
        margin: 0px;
        }

        .sidebar{
            background: #2f6fa3;
            color: white;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s ease;
            z-index: 1050;
            overflow-y: auto;
        }
         .sidebar::-webkit-scrollbar {
            width: 0px;
             background: transparent;
         }
        .profile-image{
            width: 100px;
        }
        .nav {
            padding-left: 20px; 
            padding-top: 30px;
            text-align: left;
        }
       
       .nav a { 
            color: white;
            text-decoration: none; 
        }
        .nav-icon {
             width: 20px; 
        }
        .navbar {
             background: #ede9e9;
        }
         .content-wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #f8f9fa;
        }

        .footer {
             height: 160px;
             background: #2f6fa3;
             width: 100%;
    }
    
       .animated-link {
    display: inline-block; /* Required for transform to work on inline elements */
    transition: transform 0.3s ease; 
}

/* Apply transform on hover */
.animated-link:hover {
    transform: scale(1.2); /* Scales the link up by 10% */
}
        /* MOBILE (iPhone SE) */
        @media (min-width: 768px) {
            .sidebar {
                position: sticky;
                top: 0;
            }
        }

        @media (max-width: 767.98px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                width: 250px;
                height: 100%;
                transform: translateX(-100%); /* Hidden by default on mobile */
            }

            .sidebar.show {
                transform: translateX(0); /* Slide in */
                box-shadow: 4px 0 10px rgba(0,0,0,0.2);
            }
        }

         /* Custom styles to match the image aesthetics */
        .avatar-lg { width: 50px; height: 50px; }
        .avatar-sm { width: 35px; height: 35px; }
        .status-online { background-color: #28a745; } /* Green dot */
        .msg-bubble-blue { background-color: #007bff; color: white; border-radius: 1rem 1rem 0.25rem 1rem; }
        .msg-bubble-green { background-color: #dcffc1; color: #495057; border-radius: 1rem 1rem 1rem 0.25rem; }
        .msg-input-bg { background-color: #f8f9fa; }
        .list-group-item.active { background-color: #e9ecef; border-color: #e9ecef; color: #212529; }
        /* Ensure the main container takes full screen height */
        .chat-container { height: 100vh; }

        /* Offcanvas on desktop should be static */
        @media (min-width: 992px) {
            .offcanvas-lg {
                position: static;
                z-index: auto;
                height: inherit;
                visibility: visible !important;
                background-color: transparent !important;
                border-right: 1px solid rgba(0, 0, 0, 0.2);
            }
        }
     </style>
</head>
<body>
    <div class="container-fluid p-0">
        <div class="row ">
            <div class="col-12 col-md-3  sidebar" id="sidebar">
              
                  <div class="d-flex justify-content-end p-2 d-sm-none">
                      <button class="btn btn-sm close-btn text-white" onclick="toggleSidebar()">
                          <i class="bi bi-x-lg fs-4"></i>
                      </button>
                  </div>

                 <div class="profile pt-5">
                   <img src="images/profile.jpg" alt="profile icon" class="rounded-circle  profile-image">
                 </div>

                  <form>
                    <ul class="nav flex-column mb-auto pt-5">
                       <li class="nav-item"><a href="DashBoard-Job-Provider.html" class="nav-link"><img src="images/dashboard 1.png" class="nav-icon me-2">Dashboard</a></li>
                        <li class="nav-item"><a href="Company-Job-Provider.html" class="nav-link"><img src="images/question (1) 1.png" class="nav-icon me-2">Company</a></li>
                        <li class="nav-item"><a href="Jobs-Job_Provider.html" class="nav-link"><img src="images/suitcase 2.png" class="nav-icon me-2"> Jobs</a></li>
                        <li class="nav-item"><a href="Application-Job_Provider.html" class="nav-link"><img src="images/application (1) 1.png" class="nav-icon me-2"> Applications</a></li>
                        <li class="nav-item"><a href="Interview-Job_Provider.html" class="nav-link"><img src="images/question (1) 1.png" class="nav-icon me-2"> Interviews</a></li>
                        <li class="nav-item"><a href="" class="nav-link"><img src="images/message 1.png" class="nav-icon me-2"> Messages</a></li>
                 </ul>
                  </form>

                 <div class="add-new pt-5">
                     <a href="Add-New-Job-Provider.html"><img src="images/add-group (1) 1.png" alt="Add" class="me-2"></a>
                     <div>Add New</div>
                 </div>
            </div>


            


            <!-- rightside -->
             <div class="col-12 col-sm-9 content-wrapper ">
                
                <nav class="navbar mt-3 w-100">
                    <div class="container-fluid">

                        <button class="btn  side-button btn-outline-primary btn-sm d-md-none" onclick="toggleSidebar()">
                         <i class="bi bi-list"></i>
                        </button>
                    

                        <div class="col text-end">
                            
                            <img src="images/bell.png" alt="bell" class="rounded-circle nav-icon mx-1">
                            <img src="images/cheerful.png" alt="Olivia" class="rounded-circle nav-icon mx-1">
                            <img src="images/logout.png" alt="logout" class="rounded-circle nav-icon mx-1">
                            <span class="ms-1">Logout</span>
                        </div>
                   </div>
                </nav>

                

               <div class="col-sm-12 chat-container mt-3 g-0">
              <div class="row g-0 h-100">
        <!-- Sidebar: Client List (Offcanvas on mobile, static on desktop) -->
        <div class="offcanvas-lg offcanvas-start col-lg-4 border-end bg-white" id="sidebarMenu" aria-labelledby="sidebarMenuLabel">
            <div class="offcanvas-header border-bottom">
                <h5 class="offcanvas-title" id="sidebarMenuLabel">Contacts</h5>
                <button type="button" class="btn-close d-lg-none" data-bs-dismiss="offcanvas" data-bs-target="#sidebarMenu"></button>
            </div>
            <div class="offcanvas-body p-0 overflow-aut">
                <div class="list-group list-group-flush w-100">
                    <!-- Example Active Contact (Vivek Choudhari) -->
                    <a href="#" class="list-group-item list-group-item-action active p-3">
                        <div class="d-flex align-items-center">
                            <img src="images/cheerful.png" class="rounded-circle me-3 avatar-lg" alt="Vivek">
                            <div class="flex-grow-1 overflow-hidden">
                                <div class="d-flex justify-content-between align-items-center">
                                    <h6 class="mb-0 text-truncate">Vivek Choudhari</h6>
                                    <span class="badge bg-danger rounded-circle p-2">1</span>
                                </div>
                                <p class="small mb-0 opacity-75">OK</p>
                                <span class="badge bg-success status-online position-absolute" style="bottom: 8px; left: 48px;"></span>
                            </div>
                        </div>
                    </a>
                    <!-- Other Contacts -->
                    <a href="#" class="list-group-item list-group-item-action p-3">
                        <div class="d-flex align-items-center">
                            <img src="images/apply-now-2.webp" class="rounded-circle me-3 avatar-lg" alt="Lily">
                            <div class="flex-grow-1 overflow-hidden">
                                <div class="d-flex justify-content-between align-items-center">
                                    <h6 class="mb-0 text-truncate">Lily Schaden</h6>
                                    <span class="badge bg-danger rounded-circle p-2">1</span>
                                </div>
                                <p class="small mb-0 opacity-75">I'm Sending You</p>
                            </div>
                        </div>
                    </a>
                    <a href="#" class="list-group-item list-group-item-action p-3">
                        <div class="d-flex align-items-center">
                            <img src="images/messg1.jpg" class="rounded-circle me-3 avatar-lg" alt="Daisy">
                            <div class="flex-grow-1 overflow-hidden">
                                <div class="d-flex justify-content-between align-items-center">
                                    <h6 class="mb-0 text-truncate">Daisy Reynolds</h6>
                                    <small class="opacity-75">5 hours ago</small>
                                </div>
                                <p class="small mb-0 opacity-75">Ok. Thanks</p>
                            </div>
                        </div>
                    </a>
                    <!-- Add Jerry Nickolas, Harshavardhan, John Reacher items following the same pattern -->
                </div>
            </div>
        </div>

        <!-- Chat Main Area -->
        <main class="col-lg-8 d-flex flex-column vh-100 bg-light">
            <!-- Chat Header -->
            <div class="p-3 bg-white border-bottom shadow-sm d-flex align-items-center">
                <!-- Mobile menu toggle button -->
                <button class="btn btn-outline-secondary d-lg-none me-3" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
                    <i class="bi bi-list"></i>
                </button>
                <div class="d-flex align-items-center">
                    <div class="position-relative">
                        <img src="images/cheerful.png" class="rounded-circle avatar-lg" alt="Jerry">
                        <span class="position-absolute bottom-0 end-0 p-1 status-online border border-white rounded-circle"></span>
                    </div>
                    <div class="ms-3">
                        <h5 class="mb-0">Vivek Choudhari</h5>
                        <small class="text-muted">Online</small>
                    </div>
                </div>
                <div class="ms-auto d-flex gap-3">
                    <button class="btn btn-outline-secondary rounded-circle"><i class="bi bi-camera-video"></i></button>
                    <button class="btn btn-outline-secondary rounded-circle"><i class="bi bi-telephone"></i></button>
                </div>
            </div>

            <!-- Scrollable Messages -->
            <div class="flex-grow-1 overflow-auto p-4 d-flex flex-column gap-3">
                <!-- Outgoing Message (Blue Bubble) -->
                <div class="align-self-end msg-bubble-blue p-3 shadow-sm" style="max-width: 85%;">
                    Hello... 😄
                </div>
                
                <!-- Incoming Message (Green Bubble) -->
                <div class="align-self-start d-flex align-items-start" style="max-width: 85%;">
                    <img src="images/messg1.jpg" class="rounded-circle me-3 avatar-sm" alt="Daisy">
                    <div class="msg-bubble-green p-3 shadow-sm">
                        Hi Jerry, Send me the biodata !!!
                    </div>
                </div>
                
                <!-- Outgoing Message (Blue Bubble, OK button style) -->
                <div class="align-self-end msg-bubble-blue p-3 shadow-sm d-flex align-items-center gap-2">
                    OK... <i class="bi bi-hand-thumbs-up-fill"></i>
                </div>

                <!-- Outgoing Message (Blue Bubble, Thank you) -->
                <div class="align-self-end msg-bubble-blue p-3 shadow-sm" style="max-width: 85%;">
                    Thank You...
                </div>
            </div>

            <!-- Input Area -->
            <div class="p-3 bg-white border-top">
                <div class="input-group msg-input-bg rounded-pill overflow-hidden shadow-sm">
                    <input type="text" class="form-control border-0 bg-transparent py-2 ps-4" placeholder="Type here.">
                    <button class="btn border-0 text-muted" type="button"><i class="bi bi-paperclip"></i></button>
                    <button class="btn border-0 text-muted" type="button"><i class="bi bi-emoji-smile"></i></button>
                    <button class="btn btn-primary rounded-circle m-1 p-0" style="width: 40px; height: 40px;" type="button">
                        <i class="bi bi-send-fill"></i>
                    </button>
                </div>
            </div>
        </main>
    </div>
</div>
                </div>
                
 
             </div>
              <div class="footer"></div>
        </div>
    </div>
    <script>
function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("show");
     
   
}
</script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
</body>
</html>
