<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
       body{
       
        min-height: 100vh;
        width: 100%;
       
        margin: 0;
        /* padding: 15px; */
        }
        .signup-card{
            border: 0px solid;
            width: 100%;
            /* height: 400px; */
            box-shadow: 0 0 0.25em 0.25em rgba(0, 0, 0, 0.25);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            color:#0d6efd;
            /* max-width: 700px; */
           
           
        }
         .form-group {
            position: relative;
            margin-bottom: 20px;
        }
        .form-input{
            width: 100%;
            border: 0px none;
            border-bottom: 2px solid #0d6efd;
            padding: 10px 10px 10px 35px; 
            outline: none;
            transition: border-color 0.3s;
        } 
        
        .input-icon{
             position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            pointer-events: none; 
        } 
         #loader-overlay {
            position: fixed; /* Sit on top of the page content */
            display: none;  /* Hidden by default, use JS to show */
            width: 100%; /* Full width */
            height: 100%; /* Full height */
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(51, 53, 54, 0.8); /* Black background with 70% opacity */
            z-index:1; /* Ensure it is on top of other elements */
        }
         /* Centers the content within the overlay */
        .loader-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: rgb(8, 8, 8); /* Text color */

            display: flex;        /* Activates Flexbox */
            align-items: center;  /* Vertically aligns items in the center */
            justify-content: center; /* Horizontally centers the group */
            gap: 10px;
        }
         /* The actual spinning animation */
        .spinner {
            border: 3px solid #0d0c0c; /* Light grey border */
            border-top: 3px solid #4b4c4c; /* Blue top border */
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 2s linear infinite; /* Spin animation defined below */
            margin: 0 auto 10px auto; /* Center the spinner and add some space below */
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
 <div id="loader-overlay">
        <div class="loader-wrapper">
            <!-- The spinner container -->
            <p>Please check Your Mail</p>
            <div class="spinner"></div>
        </div>
</div>


<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center">
    <div class="row w-100 justify-content-center">
        
        <div class="col-sm-12 col-md-8 col-lg-6 d-flex justify-content-center">
           <div class="signup-card">
               <h2><img src="images/signin.png" alt="signin" style="width:35px;" class="align-middle me-2">Sign Up</h2>
            <form>
            <div class="form-group">
                  <img src="images/person.png" alt="person icon" class="input-icon">
                <input type="text" id="firstname"   placeholder="firstName" class="form-input">
            </div>

            <div class="form-group">
                <img src="images/person.png" alt="person icon" class="input-icon">
                <input type="text" id="lastname" placeholder="lastname" class="form-input">
            </div>

            <div class="form-group">
                <img src="images/person.png" alt="person icon" class="input-icon">
                <input type="username" id="username" placeholder="userName" class="form-input">
            </div>

            <div class="form-group">
                <img src="images/mail.png" alt="mail icon" class="input-icon">
                <input type="email" id="email" placeholder="email" class="form-input">
            </div>

            <div class="form-group">
                <img src="images/lock.png" alt="lock icon" class="input-icon">
                <input type="tel" id="telephone" placeholder="phone" class="form-input">
            </div>

            <div class="d-flex justify-content-start">
                 <button type="button" class="btn btn-primary  d-inline-flex align-items-center justify-content-center " onclick="showLoader()">
                    <img src="images/signin.png" style="width:15px; height:15px;" class="me-2" alt="icon">
                         Sign Up
                 </button>
            </div>
        </form>
    </div>
    </div>
    </div>
</div>
<script>
        // Function to show the loader
        function showLoader() {
            document.getElementById("loader-overlay").style.display = "block";
        }

        // Function to hide the loader (call this when your process is done)
        function hideLoader() {
            document.getElementById("loader-overlay").style.display = "none";
        }

        function showLoader() {
            document.getElementById("loader-overlay").style.display = "block";
            // Auto-hide after 3 seconds for demonstration

            setTimeout(hideLoader, 3000);
        }

        function hideLoader() {
            document.getElementById("loader-overlay").style.display = "none";
            window.location.href = 'file:///C:/Batch-36-.Net-Core-Full-Stack/4.Bootstrap/Shinsina/Exercise/ConfirmPassword-Job-Provider.html';
        }

        
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
