<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidebar Layout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body, html { height: 100%; margin: 0; }
    
    .leftside {
      background: #2f6fa3;
      color: white;
      min-height:100%;
      padding: 20px;
      text-align: center;
   position: sticky;      
  top: 0;
   height: 100vh; /* Takes full viewport height */
    overflow-y: auto; /* Adds scrollbar inside sidebar if needed */
  
    }
    .profile-image { border-radius: 50%; width: 100px; }
    
    /* Adjusted padding for mobile responsiveness */
    .nav {
      padding-left: 20px; 
      padding-top: 30px;
      text-align: left;
    }
    .nav a { color: white;
       text-decoration: none; 
      }
    .nav-icon { width: 30px; 
    }
    .navbar { background: #ede9e9;
     }
    #find::placeholder { 
      opacity: 0.3;
       color: black; 
      }
    
    
    .card-body {
      background-color: #2f6fa3;
      border-radius: 5px;
      text-align: center;
      color: white;
    }
    .card { border: none;
       margin-bottom: 20px; }
    .leftside::-webkit-scrollbar {
    width: 0px;
    background: transparent;
}
    /* Flex wrapper to push footer down */
    .content-wrapper {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
        overflow-y: visible; /* Allows the main body to scroll naturally */
    }
    .main-content { flex-grow: 1; }
    .side-button{
      .topbar {
  background: #fff;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #ddd;
  position: sticky;
  top: 0;
  z-index: 10;
}
    }
    .footer {
      height: 160px;
      background: #2f6fa3;
      width: 100%;
    }


 /* Add this to your <style> tag */
.wrapper {
  display: flex; /* This aligns sidebar and main side-by-side */
  min-height: 100vh;
}

.main {
  flex-grow: 1; /* This makes the content fill the remaining space */
  overflow-x: hidden;
}

/* Adjusting your mobile breakpoint slightly for better coverage */
@media (max-width: 768px) {
  .sidebar {
    position: absolute; 
    left: -250px;    
    top: 0;
    z-index: 1000;
    transition: 0.3s ease;
  }

  .sidebar.show {
    left: 0; 
  }
}
  </style>
</head>

<body>
  <div class="container-fluid  p-0">
    <div class="row g-0"> 
      
      <!-- Sidebar: Full width on mobile (col-12), 3-cols on desktop (col-md-3) -->
      <div class="col-12 col-md-3">
        <aside class="sidebar leftside " id="sidebar">


        <div class="d-flex justify-content-end p-2 d-sm-none">
     <button class="btn btn-sm close-btn text-white" onclick="toggleSidebar()">
                          <i class="bi bi-x-lg fs-4"></i>
                      </button>
  </div>
   <!-- is the closing tag you are looking for --> 





          <div class="profile pt-5">
            <img src="images/profile.jpg" alt="profile icon" class="profile-image">
          </div>
          <ul class="nav flex-column mb-auto pt-5">
           <li class="nav-item"><a href="DashBoard-Job-Provider.html" class="nav-link"><img src="images/dashboard 1.png" class="nav-icon me-2">Dashboard</a></li>
            <li class="nav-item"><a href="Company-Job-Provider.html" class="nav-link"><img src="images/question (1) 1.png" class="nav-icon me-2">Company</a></li>
            <li class="nav-item"><a href="Jobs-Job_Provider.html" class="nav-link"><img src="images/suitcase 2.png" class="nav-icon me-2"> Jobs</a></li>
            <li class="nav-item"><a href="Application-Job_Provider.html" class="nav-link"><img src="images/application (1) 1.png" class="nav-icon me-2"> Applications</a></li>
            <li class="nav-item"><a href="Interview-Job_Provider.html" class="nav-link"><img src="images/question (1) 1.png" class="nav-icon me-2"> Interviews</a></li>
            <li class="nav-item"><a href="messages-job-provider.html" class="nav-link"><img src="images/message 1.png" class="nav-icon me-2"> Messages</a></li>
          </ul>
          <div class="add-new pt-5">
            <a href="Add-New-Job-Provider.html"><img src="images/add-group (1) 1.png" alt="Add" class="me-2"></a>
            <div>Add New</div>
          </div>
        </aside>
      </div>

      <!-- Main Content Area -->
      <div class="col-12 col-md-9 content-wrapper">
       
        <nav class="navbar w-100">
          <div class="container-fluid">
            <button class="btn  side-button btn-outline-primary btn-sm d-md-none" onclick="toggleSidebar()">
                         <i class="bi bi-list"></i>
                        </button>
            <div class="col text-end">
                       
                        
              <img src="images/bell.png" alt="bell" class="rounded-circle nav-icon mx-1">
              <img src="images/cheerful.png" alt="Olivia" class="rounded-circle nav-icon mx-1">
              <img src="images/logout.png" alt="logout" class="rounded-circle nav-icon mx-1">
              <span class="ms-1">Logout</span>
            </div>
          </div>
        </nav>

        <div class="main-content p-4">
          <form class="mb-4">
           
            <label class="form-label fw-bold" for="find">Find Job Seeker</label>
            <input type="text" id="find" class="form-control" placeholder="type here...">
          </form>

          <div class="row g-3">
            <div class="col-12 col-md-4">
              <div class="card shadow-sm"><div class="card-body"><h5 class="card-title">Interview Scheduled</h5><p class="card-text fs-2 fw-bold">87</p></div></div>
            </div>
            <div class="col-12 col-md-4">
              <div class="card shadow-sm"><div class="card-body"><h5 class="card-title">Application Received</h5><p class="card-text fs-2 fw-bold">134</p></div></div>
            </div>
            <div class="col-12 col-md-4">
              <div class="card shadow-sm"><div class="card-body"><h5 class="card-title">Total Job Posted</h5><p class="card-text fs-2 fw-bold">121</p></div></div>
            </div>
          </div>

          <div class="row mt-4">
            <div class="col-12 d-flex align-items-center justify-content-center">
              <img src="images/work-together.jpg" alt="work-together" class="img-fluid rounded shadow">
            </div>
          </div>
        </div>

        <!-- Footer -->
        <div class="footer"></div>
      </div>
      
    </div>
  </div>
<script>
function toggleSidebar() {
  const sidebar = document.getElementById("sidebar");
  sidebar.classList.toggle("show");
}
</script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
