<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signup Modal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .modal-content {
      border-radius: 0.75rem;
      overflow: hidden;
    }
    .carousel-caption {
      bottom: 20px;
    }
    .object-fit-cover {
      object-fit: cover;
    }
    .form-section {
      background-color: #f8f9fa;
    }
  </style>
</head>
<body>





          <!-- Left: Carousel (larger) -->
          <div class="col-md-7">
            <div id="promoCarousel" class="carousel slide h-100" data-bs-ride="carousel">
              <div class="carousel-inner h-100">
                <div class="carousel-item active h-100">
                  <img src="" class="d-block w-100 h-100 object-fit-cover" alt="Tropical Beach Paradise">
                  <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded p-3">
                    <h5 class="text-light">🌴 Tropical Beach Paradise</h5>
                    <ul class="list-unstyled text-start text-light">
                      <li>🌞 7 Days of sun, sand, and unforgettable memories</li>
                      <li>🏨 5-Star Beachfront Resort</li>
                      <li>🍽️ All-Inclusive Meals</li>
                      <li>🌊 Water Sports & Activities</li>
                      <li>🚐 Airport Transfers</li>
                    </ul>
                    <p class="fs-5 text-warning">$1,299 <del class="text-light">$1,899</del></p>
                  </div>
                </div>
                <!-- Add more carousel-item blocks if needed -->
              </div>
            </div>
          </div>

          <!-- Right: Account Form (smaller) -->
          <div class="col-md-5 form-section p-4">
            <h4 class="mb-4">Create Your Account</h4>
            <form>
              <div class="mb-2">
                <input type="text" class="form-control" placeholder="First Name">
              </div>
              <div class="mb-2">
                <input type="text" class="form-control" placeholder="Last Name">
              </div>
              <div class="mb-2">
                <select class="form-select">
                  <option selected disabled>Select Gender</option>
                  <option>Male</option>
                  <option>Female</option>
                  <option>Other</option>
                </select>
              </div>
              <div class="mb-2">
                <input type="date" class="form-control" placeholder="Date of Birth">
              </div>
              <div class="mb-2">
                <input type="text" class="form-control" placeholder="Username">
              </div>
              <div class="mb-2">
                <input type="email" class="form-control" placeholder="Email">
              </div>
              <div class="mb-2">
                <input type="tel" class="form-control" placeholder="Phone Number">
              </div>
              <div class="mb-2">
                <input type="password" class="form-control" placeholder="Create a strong password">
              </div>
              <div class="mb-3">
                <input type="password" class="form-control" placeholder="Confirm Password">
              </div>
              <button type="submit" class="btn btn-success w-100">Sign Up</button>
            </form>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
