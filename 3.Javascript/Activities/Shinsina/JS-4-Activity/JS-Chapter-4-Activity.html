   console.log(mySymbol);

    const stringVal = "25";
    const numberVal = 25;

    // 1. Loose Equality (==)
    console.log( stringVal == numberVal);  // Outputs: true

    // 2. Strict Equality (===)
    console.log(stringVal === numberVal); // Outputs: false


    // 1
    let fruits=["apple","orange","grapes","blueberry"];

    const book = {
    title: "The Great Gatsby",
    author: "F. Scott Fitzgerald",
    year: 1925
};
    console.log("Q3"+" "+"Author:"+book.author);

    let a=10;

    function subtract(a, b) {
    return a - b;
    }

    const result = subtract(10, 4);

    // 6
    // 1. Create the original object
    const originalUser = { name: "Alice", age: 25 };

    // 2. Copy it into a new variable using the spread operator
    const updatedUser = { ...originalUser };

    // 3. Change a property in the second object
    updatedUser.name = "Bob";

    // 4. Print both to see they are independent
    console.log("Q6"+" "+"Original:", originalUser); // Outputs: { name: "Alice", age: 25 }
    console.log("Updated:", updatedUser);   // Outputs: { name: "Bob", age: 25 }

    let person=new Object();
