<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //even or odd
        console.log("Check even or odd:");
        let num1=50;
        if(num1%2===0){
            console.log("The number is Even!!!");
        }
        else{
            console.log("The number is Odd!!!");
        }
        //Positive or negative
        console.log("Positive or negative:");
        let num2=-1;
        if(num2<0){
            console.log("The number is negative");
        }
        else if(num2>0){
            console.log("The number is positive");
        }
        else{
            console.log("The number is zero");
        }
        //Voting eligibility 
        console.log("Voting eligibility:");
        let age=25;
        if(age>=18){
            console.log("You are Eligible");
        }
        else{
            console.log("You are not Eligible");
        }
        //Grade classification
        console.log("Grade classification:");
        let mark=93;
        if(mark>=90){
            console.log("Your Grade is: A");
        }
        else if(mark<90&&mark>=80){
            console.log("Your Grade is: B");
        }
        else if(mark<80&&mark>=70){
            console.log("Your Grade is: C");
        }
        else if(mark<70&&mark>=60){
            console.log("Your Grade is: D");
        }
        else{
            console.log("Your Grade is: F");
        }
        //Leap year check  
        console.log("Leap year check:");  
        let year=2004;
        if(year%4===0){
            console.log(year+" is a leap year");
        }
        else{
             console.log(year+" is not a leap year");
        }
        //Password strength
        console.log("Password strength:");
        let pass="1234567895";
        if(pass.length>=10){
            console.log("Strong Password");
        }
        else if(pass.length<10&&pass.length>=6){
            console.log("Medium Password");
        }
        else if(pass.length<6){
            console.log("Weak Password");
        }
        //Traffic light system  
        console.log("Traffic light system:");  
        let light="red";
        if(light==="red"){
            console.log("Stop!!!");
        }
        if(light==="yellow"){
            console.log("Ready!!!");
        }
        if(light==="Green"){
            console.log("Go!!!");
        }
        //Shopping discount 
        console.log("Shopping discount:");
        let bill=600;
        if(bill>=500){
            console.log("You have 20% discount!!!!");
        }
        if(bill<500&&bill>=200){
            console.log("You have 10% discount!!!!");
        }
        if(bill<200){
            console.log("You have no discount!!!!");
        }   
        //Triangle type  
        console.log("Triangle type:");  
    </script>
</body>
</html>
