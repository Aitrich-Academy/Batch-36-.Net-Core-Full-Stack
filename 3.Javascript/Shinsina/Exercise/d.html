<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple JS Chat</title>
    <link rel="stylesheet" href="style.css"> <!-- Link to CSS for styling -->

    <style>#chat-container { width: 100%; max-width: 600px; margin: auto; padding: 20px; }
#message-list { height: 300px; overflow-y: scroll; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
.message { padding: 10px 15px; border-radius: 20px; margin-bottom: 10px; max-width: 70%; word-wrap: break-word; }
.system-message { background-color: #007bff; color: white; align-self: flex-start; margin-right: auto; } /* Blue bubbles for AI/System */
.user-message { background-color: #e9ecef; color: black; margin-left: auto; } /* Grey bubbles for user */
#input-area { display: flex; }
#user-input { flex-grow: 1; padding: 10px; }
#send-btn { padding: 10px 15px; }</style>
</head>
<body>
    <div id="chat-container">
  <!-- Messages will be appended here by JavaScript -->
  <div class="message system-message">
    Thank you for expressing interest to join Aitrich Technologies. To get you started with your application we will ask some questions.
  </div>
  
  <div id="message-list"></div>

  <div id="input-area">
    <input type="text" id="user-input" placeholder="Type your message here.">
    <button id="send-btn" onclick="sendMessage()">Send</button>
  </div>
</div>
    <script >
       function sendMessage() {
  const userInput = document.getElementById('user-input');
  const messageList = document.getElementById('message-list');
  const messageText = userInput.value.trim();

  if (messageText) {
    // Add user message
    addMessage(messageText, 'user-message');
    userInput.value = ''; // Clear input field

    // Simulate a system response (like "Bangalore" or "Proceed")
    setTimeout(() => {
      // You would replace this with actual logic to handle different inputs
      if (messageText.toLowerCase().includes('proceed')) {
         addMessage('Your current location is set to Bangalore.', 'system-message');
      } else {
         addMessage('Thank you for the input.', 'system-message');
      }
    }, 1000);
  }
}

function addMessage(content, type) {
  const messageList = document.getElementById('message-list');
  const newMessageDiv = document.createElement('div');
  newMessageDiv.className = `message ${type}`;
  newMessageDiv.textContent = content;
  messageList.appendChild(newMessageDiv);

  // Scroll to the latest message
  messageList.scrollTop = messageList.scrollHeight;
}

// Optional: Allow sending message with the Enter key
document.getElementById('user-input').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        sendMessage();
    }
});
    </script> <!-- Link to JavaScript file -->
</body>
</html>
