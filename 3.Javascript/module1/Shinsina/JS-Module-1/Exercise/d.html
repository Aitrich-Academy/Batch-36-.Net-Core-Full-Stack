<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple JS Chat</title>
    <link rel="stylesheet" href="style.css"> <!-- Link to CSS for styling -->

     <style>
        body { font-family: sans-serif; max-width: 400px; margin: 20px auto; }
        .input-group { display: flex; gap: 5px; margin-bottom: 20px; }
        input { flex-grow: 1; padding: 8px; }
        ul { list-style: none; padding: 0; }
        li { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding: 10px; 
            border-bottom: 1px solid #ddd; 
        }
        .completed-text { text-decoration: line-through; color: gray; }
        .btn-complete { background: #4CAF50; color: white; border: none; padding: 5px; cursor: pointer; }
        .btn-delete { background: #f44336; color: white; border: none; padding: 5px; cursor: pointer; }
        .actions { display: flex; gap: 5px; }
    </style>
</head>
<body>
     <h2>Store Task Manager</h2>
    
    <div class="input-group">
        <input type="text" id="taskInput" placeholder="e.g., Restock rice bags">
        <button onclick="addTask()">Add Task</button>
    </div>
    
    <!-- Error Message Placeholder -->
    <div id="errorMessage"></div>

    <ul id="taskList"></ul>

    <script>
        const taskInput = document.getElementById('taskInput');
        const taskList = document.getElementById('taskList');
        const errorMessage = document.getElementById('errorMessage');

        function addTask() {
            const taskValue = taskInput.value.trim();

            // Error Logic: If input is empty
            if (taskValue === "") {
                errorMessage.innerText = "Error: Please enter a task before adding.";
                taskInput.style.borderColor = "#f44336";
                return;
            }

            // Clear error if input is valid
            errorMessage.innerText = "";
            taskInput.style.borderColor = "";

            const li = document.createElement('li');
            const taskSpan = document.createElement('span');
            taskSpan.innerText = taskValue;

            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'actions';

            const completeBtn = document.createElement('button');
            completeBtn.innerText = 'Complete';
            completeBtn.className = 'btn-complete';
            completeBtn.onclick = function() {
                taskSpan.classList.toggle('completed-text');
                if(!taskSpan.innerText.includes("(Completed)")) {
                    taskSpan.innerText += " (Completed)";
                    completeBtn.disabled = true;
                }
            };

            const deleteBtn = document.createElement('button');
            deleteBtn.innerText = 'Delete';
            deleteBtn.className = 'btn-delete';
            deleteBtn.onclick = function() {
                taskList.removeChild(li);
            };

            actionsDiv.appendChild(completeBtn);
            actionsDiv.appendChild(deleteBtn);
            li.appendChild(taskSpan);
            li.appendChild(actionsDiv);
            taskList.appendChild(li);

            taskInput.value = "";
        }

        // Hide error message when user starts typing
        taskInput.addEventListener("input", function() {
            errorMessage.innerText = "";
            taskInput.style.borderColor = "";
        });

        taskInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                addTask();
            }
        });
    </script>
</body>
</html>
