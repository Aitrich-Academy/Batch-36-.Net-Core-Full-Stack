<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Machine Test</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body{
            background:rgb(131, 193, 230) ;
            background-image: linear-gradient(to right, rgb(144, 227, 233), rgb(67, 149, 160));
        }
    </style>
</head>
<body>
    
    <p class="code">CODEVERSE 2025</p>
    <div class="tab">
        <p>About</p>
        <p>Speakers</p>
        <p>Schedule</p>
        <p>Register</p>
    </div>
    <p class="featured">Featured Speakers</p>
    <div class="img-container">
        <div class="img1"><img class="picture" src="images/speaker1.jpg  "></div>
        <div class="img2"><img class="picture" src="images/speaker2.jpg  "></div>
        <div class="img2"><img class="picture" src="images/speaker3.jpg  "></div>
    </div>
    <br>
    <p class="featured">Event Schedule</p>
    <div class="schedule">
        <table >
            <tr>
                <th>TIME<br><br></th>
                <th>SESSION</th>
                <th>SPEAKER</th>
            </tr>
            <tr>
                <td>10:00 AM</td>
                <td>Opening Keynote</td>
                <td>Dr. Ayesha Khan</td>
            </tr>
            <tr><td colspan="3"><hr></td></tr>
            <tr>
                <td>11:30 AM</td>
                <td>Building Scalable Web Apps</td>
                <td>Soumya S</td>
            </tr>
            <tr><td colspan="3"><hr></td></tr>
            <tr>
                <td>2:00 PM</td>
                <td>Cloud Native Strategies</td>
                <td>Rajiv Menon</td>
            </tr>
            <tr><td colspan="3"><hr></td></tr>
        </table>
    </div>
    <br><br>
    <br><br>
    <div class="register">
        
        <img class="img-register" src="images/register-now.jpg">
    </div>
    
</body>
</html>
