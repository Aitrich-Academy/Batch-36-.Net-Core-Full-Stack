<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .login{
            width: 350px ;
            height: 500px;
            border: solid 2px rgb(175, 171, 171);
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .inner{
            width: 320px;px;
            height: 35px;
            margin-left: 20px;
            border-bottom: solid 2px rgb(243, 242, 242);
            border-left: solid 1px rgb(235, 235, 235);
            border-right: solid 1px rgb(235, 235, 235);
            /* align-items: center;
            text-align: center; */
        }
        .text1{
            height: 30px;
            width: 300px;
            border-color: rgb(206, 204, 204);
        }
        .login check1 {
            align-items: left;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login">
        <img src="images/login.png" width="35px" height="40px">
        <h2>Welcome Back</h2><br>
        <div class="inner">
            <pre><img src="images/google.png" width="20px" align="center">      <font color="blue" face="times">Login with Google</font>          </pre>
        </div>
        <BR>
        <font color="#c2bebe" >OR LOGIN WITH E-MAIL</font><br><br>
        <input class="text1" type="text" placeholder="Your Email" ><br><br>
        <input class="text1" type="text" placeholder="Your Password" ><br><br>
        <div align="left">&nbsp;&nbsp;<input type="checkbox" id="check1" ><b>Keep me logged in</b></div><br><br>
        <input type="submit" value="Log in " style="width: 300px; height: 30px; color: white; background-color: rgb(118, 166, 238); border-color:rgb(118, 166, 238) ;"

    </div>
</body>
</html>
