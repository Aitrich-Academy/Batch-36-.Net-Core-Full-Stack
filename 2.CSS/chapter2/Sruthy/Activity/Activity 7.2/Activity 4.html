<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            width:100%;
            margin: 0px;
            padding: 0px;
            margin-left: 0;
        }
        .left{
            width: 30%;
            background-color: rgb(77, 116, 245);
            color: white;
            padding : 15px;
        }
        .right{
            width: 100%;
            padding: 25px;
            padding-left: 35px;
        }
        .left h2{
            color: white;
        }
        ul.a{
            list-style-type: none;
           
        }
        .right_content{
            width: 1000px;
            height: 500px;
            border: solid 2px rgb(233, 230, 230);
            border-radius: 10px;
            text-align: center;
           
        }
        .right_content div{
            margin-left: 40px;
            margin-right: 40px;
        }
    </style>
</head>
<body>
    <table class="main" cellpadding="0" cellspacing="0">
        <tr>
            <td class="left">
                <h2>Hire Me Now!</h2><br><br><br>
                <ul class="a">
                    <li>
                        <img src="images/dashboard 1.png" width="25px" align="center">&nbsp;&nbsp;<b>Dash Board</b>
                    </li><br><br>
                    <li>
                        <img src="images/suitcase 2.png" width="25px" align="center">&nbsp;&nbsp;<b>Jobs</b>
                    </li><br><br>
                    <li>
                        <img src="images/application (1) 1.png" width="25px" align="center">&nbsp;&nbsp;<b>Applications</b>
                    </li><br><br>
                    <li>
                        <img src="images/interview.png" width="25px" align="center">&nbsp;&nbsp;<b>Interviews</b>
                    </li><br><br>
                    <li>
                        <img src="images/message 1.png" width="25px" align="center">&nbsp;&nbsp;<b>Message</b>
                    </li><br><br>
                </ul>
            </td>
            <td class="right">
                <div class="right_content">
                    <br><br><br>
                    <img src="images/profile.jpg" width="120px" height="100px">
                    <h2>Job Provider/ Company member</h2>
                    <font color="grey" >Company Name<br>Designation<br></font>
                    <div align="left">
                        <img src="images/mail.png" width="25" align="center">&nbsp;<font color="grey">provider@mail.com</font> <br><br>
                        <img src="images/call.png" width="25" align="center">&nbsp;<font color="grey">123456789012</font> <br><br>
                        <img src="images/location.png" width="30" align="center"><font color="grey">provider@mail.com</font> <br><br>
                    </div>
                    <div align="right"><img src="images/edit_icon.png" width="35px"</div>


                    
                </div>
            </td>
        </tr>

    </table>
    
</body>
</html>
